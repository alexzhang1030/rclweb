# Publish rcl-web (npm trusted publishing), rclweb / rclwebd (crates.io),
# the six rclwebd runtime images (GHCR), prebuilt gateway binaries
# (GitHub Release assets), and the own apt repo (ADR 0019) when
# RCLWEB_APT_GPG_PRIVATE_KEY is set. ADR 0018 covers image / binary
# distribution. A rebuild-v<version> tag republishes only images,
# binaries, and apt for an existing version (registries refuse
# duplicates; GHCR tags move).
# npm OIDC identity is this filename only — do not rename without updating
# npmjs.com. No GitHub environment on the npm job (leave Environment blank
# on the trusted publisher). See docs/release.md.
name: release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: Publish rcl-web to npm via OIDC
        type: boolean
        default: true
      crates:
        description: Publish rclweb and rclwebd to crates.io via OIDC
        type: boolean
        default: true
      images:
        description: Publish rclwebd runtime images to GHCR
        type: boolean
        default: true
      binaries:
        description: Upload prebuilt rclwebd binaries to the GitHub Release
        type: boolean
        default: true
      apt:
        description: Pack rclwebd debs and publish the signed apt repo when the archive key secret is set
        type: boolean
        default: true
  push:
    tags:
      - "v*"
      - "rebuild-v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-npm:
    name: publish-npm
    if: (github.event_name == 'push' && !startsWith(github.ref_name, 'rebuild-')) || inputs.npm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read toolchain pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          just_version="$(tr -d '[:space:]' < .just-version)"
          channel="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          echo "just=${just_version}" >> "${GITHUB_OUTPUT}"
          echo "rust=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up just from .just-version
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.pins.outputs.just }}

      - name: Set up Rust from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.pins.outputs.rust }}
          targets: wasm32-unknown-unknown

      - name: Install JavaScript workspace (frozen lockfile)
        shell: bash
        run: bun install --frozen-lockfile

      - name: Build wasm + tsdown bundle
        shell: bash
        run: just build

      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI ≥ 11.5.1
        shell: bash
        run: npm install -g npm@latest

      - name: Drop empty _authToken so npm uses OIDC
        shell: bash
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN || true
          for f in ${NPM_CONFIG_USERCONFIG:-} "${HOME}/.npmrc"; do
            if [[ -f "${f}" ]]; then
              sed -i '/_authToken/d' "${f}"
            fi
          done

      - name: Refuse a version already on npm
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          code="$(curl -sS -o /tmp/npm-rcl-web.json -w '%{http_code}' "https://registry.npmjs.org/rcl-web/${version}")"
          if [[ "${code}" == "200" ]]; then
            echo "error: rcl-web@${version} is already on npm. Bump typescript/package.json first." >&2
            exit 1
          fi
          if [[ "${code}" != "404" ]]; then
            echo "error: npm lookup failed: HTTP ${code}" >&2
            cat /tmp/npm-rcl-web.json >&2
            exit 1
          fi

      - name: Publish rcl-web
        working-directory: typescript
        shell: bash
        run: npm publish

  publish-crates:
    name: publish-crates
    if: (github.event_name == 'push' && !startsWith(github.ref_name, 'rebuild-')) || inputs.crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read toolchain pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          just_version="$(tr -d '[:space:]' < .just-version)"
          channel="$(awk -F'"' '/^[[:space:]]*channel[[:space:]]*=/{print $2; exit}' rust-toolchain.toml)"
          echo "just=${just_version}" >> "${GITHUB_OUTPUT}"
          echo "rust=${channel}" >> "${GITHUB_OUTPUT}"

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up just from .just-version
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: ${{ steps.pins.outputs.just }}

      - name: Set up Rust from rust-toolchain.toml
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.pins.outputs.rust }}

      - name: Require crates.io bootstrap
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/crates-rclweb.json -w '%{http_code}' -A 'rclweb-release/0.0.3 (https://github.com/alexzhang1030/rclweb)' https://crates.io/api/v1/crates/rclweb)"
          if [[ "${code}" == "404" ]]; then
            echo "error: rclweb is not on crates.io yet. First publish is a human cargo publish (docs/release.md)." >&2
            exit 1
          fi
          if [[ "${code}" != "200" ]]; then
            echo "error: crates.io lookup failed: HTTP ${code}" >&2
            cat /tmp/crates-rclweb.json >&2
            exit 1
          fi

      - name: Stage LICENSE/NOTICE into crate packages
        shell: bash
        run: bun run scripts/cargo-publish.ts --stage

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish rclweb then rclwebd
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish -p rclweb --locked
          # crates.io's sparse index lags the HTTP API; rclwebd verify
          # downloads rclweb from the registry. Retry until the index sees it.
          attempt=1
          until cargo publish -p rclwebd --locked; do
            if (( attempt >= 12 )); then
              echo "error: cargo publish -p rclwebd failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "rclwebd publish failed (attempt ${attempt}); waiting for crates.io index" >&2
            attempt=$((attempt + 1))
            sleep 20
          done

  # Six-row runtime images (ADR 0018 stage 1), linux/amd64 + linux/arm64.
  # Each arch builds natively (arm64 on ubuntu-24.04-arm; QEMU-emulated
  # cargo builds are impractical) and pushes <version>-<row>-<arch>;
  # publish-image-manifests combines them into the user-facing tags:
  # <version>-<row> plus rolling <row>, and aliases jazzy (J-FT),
  # humble (H-FT), latest (J-FT).
  publish-images:
    name: publish-image (${{ matrix.row }}, ${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.images
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        row: [j-ft, j-cy, j-zn, h-ft, h-cy, h-zn]
        include:
          - row: j-ft
            dockerfile: docker/Dockerfile.rclwebd
            build_args: ""
          - row: j-cy
            dockerfile: docker/Dockerfile.rclwebd
            build_args: >-
              --build-arg SUPPORT_ROW=J-CY
              --build-arg RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
              --build-arg RMW_APT_PACKAGES=ros-jazzy-rmw-cyclonedds-cpp
          - row: j-zn
            dockerfile: docker/Dockerfile.rclwebd
            build_args: >-
              --build-arg SUPPORT_ROW=J-ZN
              --build-arg RMW_IMPLEMENTATION=rmw_zenoh_cpp
              --build-arg RMW_APT_PACKAGES=ros-jazzy-rmw-zenoh-cpp
          - row: h-ft
            dockerfile: docker/Dockerfile.rclwebd-h-ft
            build_args: ""
          - row: h-cy
            dockerfile: docker/Dockerfile.rclwebd-h-ft
            build_args: >-
              --build-arg SUPPORT_ROW=H-CY
              --build-arg RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
              --build-arg RMW_APT_PACKAGES=ros-humble-rmw-cyclonedds-cpp
          - row: h-zn
            dockerfile: docker/Dockerfile.rclwebd-h-ft
            build_args: >-
              --build-arg SUPPORT_ROW=H-ZN
              --build-arg RMW_IMPLEMENTATION=rmw_zenoh_cpp
              --build-arg RMW_APT_PACKAGES=ros-humble-rmw-zenoh-cpp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#rebuild-}"
            version="${version#v}"
          else
            version="$(awk -F'"' '/^\[workspace\.package\]/{p=1} p && /^version/{print $2; exit}' Cargo.toml)"
          fi
          if [[ -z "${version}" ]]; then
            echo "error: could not resolve a release version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push per-arch image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ROW: ${{ matrix.row }}
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rclwebd"
          # shellcheck disable=SC2086 — BUILD_ARGS is a flag list by design
          docker build -f "${DOCKERFILE}" ${BUILD_ARGS} \
            -t "${image}:${VERSION}-${ROW}-${ARCH}" .
          docker push "${image}:${VERSION}-${ROW}-${ARCH}"

  # Combine the per-arch pushes into multi-arch manifest lists for the
  # user-facing tags. Runs once after every (row, arch) build succeeds.
  publish-image-manifests:
    name: publish-image-manifests
    if: github.event_name == 'push' || inputs.images
    needs: publish-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#rebuild-}"
            version="${version#v}"
          else
            version="$(awk -F'"' '/^\[workspace\.package\]/{p=1} p && /^version/{print $2; exit}' Cargo.toml)"
          fi
          if [[ -z "${version}" ]]; then
            echo "error: could not resolve a release version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Create and push multi-arch manifests
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rclwebd"
          for row in j-ft j-cy j-zn h-ft h-cy h-zn; do
            case "${row}" in
              j-ft) aliases="jazzy latest" ;;
              h-ft) aliases="humble" ;;
              *) aliases="" ;;
            esac
            tags=(-t "${image}:${VERSION}-${row}" -t "${image}:${row}")
            for alias in ${aliases}; do
              tags+=(-t "${image}:${alias}")
            done
            docker buildx imagetools create "${tags[@]}" \
              "${image}:${VERSION}-${row}-amd64" \
              "${image}:${VERSION}-${row}-arm64"
          done

  # Prebuilt gateway binaries (ADR 0018 stage 4), amd64 + arm64 (native
  # runners). Built inside the same digest-pinned builder stages the runtime
  # images use, so the glibc floor matches each distro's Ubuntu base and
  # Humble gets regenerated bindings. Uploaded to the GitHub Release for the
  # version tag (created if missing).
  publish-binaries:
    name: publish-binary (${{ matrix.distro }}, ${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.binaries
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: [jazzy, humble]
        include:
          - distro: jazzy
            dockerfile: docker/Dockerfile.rclwebd
          - distro: humble
            dockerfile: docker/Dockerfile.rclwebd-h-ft
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#rebuild-}"
            version="${version#v}"
          else
            version="$(awk -F'"' '/^\[workspace\.package\]/{p=1} p && /^version/{print $2; exit}' Cargo.toml)"
          fi
          if [[ -z "${version}" ]]; then
            echo "error: could not resolve a release version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Build gateway binary in the builder stage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISTRO: ${{ matrix.distro }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "error: unsupported runner architecture $(uname -m)" >&2; exit 1 ;;
          esac
          asset="rclwebd-${VERSION}-${DISTRO}-${arch}"
          docker build --target builder -f "${DOCKERFILE}" \
            -t "rclwebd-builder-${DISTRO}" .
          cid="$(docker create "rclwebd-builder-${DISTRO}")"
          docker cp "${cid}:/src/target/release/rclwebd" "${asset}"
          docker rm "${cid}"
          sha256sum "${asset}" > "${asset}.sha256"
          echo "asset=${asset}" >> "${GITHUB_ENV}"
          echo "arch=${arch}" >> "${GITHUB_ENV}"

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Pack rclwebd .deb
        shell: bash
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          mkdir -p debs
          bun run scripts/pack-rclwebd-deb.ts \
            --bin "${asset}" \
            --distro "${DISTRO}" \
            --arch "${arch}" \
            --out-dir debs
          sha256sum debs/*.deb > "debs/$(basename debs/*.deb).sha256"

      - name: Upload deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.arch }}
          path: debs/
          if-no-files-found: error

      - name: Upload to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # The two matrix jobs can race create; losing the race is fine
            # as long as the release exists afterwards.
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --generate-notes \
              || gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          fi
          gh release upload "${TAG}" "${asset}" "${asset}.sha256" debs/*.deb debs/*.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber

  # Own apt repo (ADR 0019). Needs the four rclwebd debs. Signs and
  # publishes gh-pages only when RCLWEB_APT_GPG_PRIVATE_KEY is set.
  publish-apt:
    name: publish-apt
    needs: publish-binaries
    if: github.event_name == 'push' || inputs.apt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#rebuild-}"
            version="${version#v}"
          else
            version="$(awk -F'"' '/^\[workspace\.package\]/{p=1} p && /^version/{print $2; exit}' Cargo.toml)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install apt repo tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

      - name: Download rclwebd debs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-*
          path: collected-debs

      - name: Publish signed apt repo
        id: apt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RCLWEB_APT_GPG_PRIVATE_KEY: ${{ secrets.RCLWEB_APT_GPG_PRIVATE_KEY }}
          RCLWEB_APT_GPG_PASSPHRASE: ${{ secrets.RCLWEB_APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p debs
          mapfile -t packed < <(find collected-debs -name 'rclwebd_*.deb' -type f | sort)
          if (( ${#packed[@]} != 4 )); then
            echo "error: expected 4 rclwebd debs, found ${#packed[@]}" >&2
            find collected-debs -type f >&2
            exit 1
          fi
          cp "${packed[@]}" debs/
          scripts/publish-signed-apt.sh --debs-dir debs --out-dir repo
          if [[ -f repo/index.html ]]; then
            tar -C repo -czf "rclweb-apt-repo-${VERSION}.tar.gz" \
              apt index.html .nojekyll \
              rclweb-archive-keyring.gpg enable-apt.sh
            sha256sum "rclweb-apt-repo-${VERSION}.tar.gz" debs/rclweb-apt-source_*.deb > apt-extra.sha256
            gh release upload "${TAG}" \
              debs/rclweb-apt-source_*.deb \
              "rclweb-apt-repo-${VERSION}.tar.gz" \
              apt-extra.sha256 \
              --repo "${GITHUB_REPOSITORY}" --clobber
          fi

      - name: Publish GitHub Pages
        if: steps.apt.outputs.signed == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/push-apt-gh-pages.sh --repo-dir repo
