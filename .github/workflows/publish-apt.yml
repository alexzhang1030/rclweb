# Publish the own apt repo (ADR 0019) from existing GitHub Release
# binaries. Does not rebuild images, binaries, npm, or crates.
# Tag apt-v<version> or Actions → publish-apt → Run workflow.
name: publish-apt

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version whose binaries to wrap (no v prefix)
        type: string
        default: "0.0.6"
  push:
    tags:
      - "apt-v*"

permissions:
  contents: read

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  publish-apt:
    name: publish-apt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="${GITHUB_REF_NAME#apt-v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ -z "${version}" || "${version}" == "${GITHUB_REF_NAME:-}" ]]; then
            echo "error: could not resolve a release version from ${GITHUB_REF_NAME:-dispatch}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install apt repo tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev gnupg

      - name: Download release binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p bins
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern 'rclwebd-*' --dir bins
          (
            cd bins
            sha256sum -c rclwebd-*.sha256
          )

      - name: Pack rclwebd debs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p debs
          bun run scripts/pack-release-debs.ts \
            --bin-dir bins \
            --out-dir debs \
            --version "${VERSION}"
          sha256sum debs/*.deb > debs/rclwebd.debs.sha256

      - name: Upload debs to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" debs/*.deb debs/rclwebd.debs.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish signed apt repo
        id: apt
        shell: bash
        env:
          RCLWEB_APT_GPG_PRIVATE_KEY: ${{ secrets.RCLWEB_APT_GPG_PRIVATE_KEY }}
          RCLWEB_APT_GPG_PASSPHRASE: ${{ secrets.RCLWEB_APT_GPG_PASSPHRASE }}
        run: scripts/publish-signed-apt.sh --debs-dir debs --out-dir repo

      - name: Upload apt-source and repo tarball
        if: steps.apt.outputs.signed == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tar -C repo -czf "rclweb-apt-repo-${VERSION}.tar.gz" \
            apt index.html .nojekyll \
            rclweb-archive-keyring.gpg enable-apt.sh
          sha256sum "rclweb-apt-repo-${VERSION}.tar.gz" debs/rclweb-apt-source_*.deb > apt-extra.sha256
          gh release upload "${TAG}" \
            debs/rclweb-apt-source_*.deb \
            "rclweb-apt-repo-${VERSION}.tar.gz" \
            apt-extra.sha256 \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish GitHub Pages
        if: steps.apt.outputs.signed == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/push-apt-gh-pages.sh --repo-dir repo
