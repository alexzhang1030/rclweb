# Delete leftover GitHub heads after a PR closes, and sweep abandoned
# branches daily. The repository setting Automatically delete head
# branches already covers squash-merged PR heads.
name: delete-unused-branches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delete-unused-branches
  cancel-in-progress: false

jobs:
  delete:
    name: delete-unused-branches
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun from .bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Delete unused branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOSED_HEAD: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bun run scripts/delete-unused-branches.ts --apply --closed-head "${CLOSED_HEAD}"
          else
            bun run scripts/delete-unused-branches.ts --apply
          fi
